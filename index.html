<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Portfolio of Mustafa Yaqin, web developer | پورتفولیوی مصطفی یقین" />
    <link rel="icon" href="/logo.jpg" />
    <script>
      // حالت روشن/تاریک را قبل از نمایش صفحه تنظیم می‌کند تا رنگ سایت چشمک نزند
      // پیش‌فرض: روشن. فقط اگر بازدیدکننده قبلاً تاریک را انتخاب کرده باشد، تاریک می‌شود.
      (function () {
        var dark = localStorage.getItem("yaqin-theme") === "dark";
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      })();
    </script>
    <title>مصطفی یقین | توسعه‌دهنده وب</title>

    <!-- فونت: بدون مسدود کردن صفحه بارگذاری می‌شود.
         اگر اینترنت ضعیف یا قطع باشد، صفحه بلافاصله با فونت Tahoma نشان داده می‌شود و فونت بعداً جایگزین می‌شود. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800&display=swap" />
    </noscript>

    <!-- صفحه بارگذاری اولیه: تا وقتی فایل‌های سایت می‌آیند، به‌جای صفحه سفید، یک چرخنده دیده می‌شود -->
    <style>
      body { margin: 0; background: #f4f7f6; }
      :root[data-theme="dark"] body { background: #0d0f12; }
      .boot { min-height: 100vh; display: grid; place-items: center; }
      .boot span { width: 38px; height: 38px; border-radius: 50%; border: 4px solid #7ba1a8; border-top-color: transparent; animation: boot-spin 0.8s linear infinite; }
      :root[data-theme="dark"] .boot span { border-color: #f3f4f6; border-top-color: transparent; }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="root"><div class="boot"><span></span></div></div>
    <noscript>برای دیدن این سایت، جاوااسکریپت را روشن کنید. / Please enable JavaScript.</noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
